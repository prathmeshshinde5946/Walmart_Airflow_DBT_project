version: 2

models:
  - name: products_t
    description: "Cleaned/deduplicated products table from the silver technical layer"
    columns:
      - name: product_id
        description: "Primary key — unique identifier for a product"
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: "Name of the product"
        data_tests:
          - not_null

      - name: category
        description: "Product category"
        data_tests:
          - not_null

      - name: brand
        description: "Product brand"
        data_tests:
          - not_null

      - name: price
        description: "Unit price of the product"
        data_tests:
          - not_null
        config:
          where: "price > 0"

      - name: is_active
        description: "Flag indicating whether the product is currently active"
        data_tests:
          - accepted_values:
              values: ['Y', 'N']

      - name: created_timestamp
        description: "Timestamp the record was created in source"
        data_tests:
          - not_null

      - name: updated_timestamp
        description: "Timestamp the record was last updated in source"
        data_tests:
          - not_null

  - name: orders_t
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          

      - name: total_amount
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
  - name: employees_t
    columns: 
      - name: job_title
        data_tests:
          - not_null
  - name: customers_t
    description: "Cleaned/deduplicated customer records from the silver technical layer"
    columns:
      - name: customer_id
        description: "Primary key — unique identifier for a customer"
        data_tests:
          - not_null
          - unique

      - name: customer_email
        description: "Customer's email address"
        data_tests:
          - not_null
          - unique

      - name: customer_phone
        description: "Customer's phone number"
        data_tests:
          - not_null

      - name: customer_city
        description: "City the customer is located in"
        data_tests:
          - not_null

      - name: customer_country
        description: "Country the customer is located in"
       

      - name: customer_is_active
        description: "Flag indicating whether the customer account is active"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Y', 'N']

      - name: customer_created_timestamp
        description: "Timestamp the customer record was created in source"
        data_tests:
          - not_null

      - name: customer_updated_timestamp
        description: "Timestamp the customer record was last updated in source"
        data_tests:
          - not_null
  - name: order_items_t
    description: "Cleaned/deduplicated order items table from the silver technical layer"
    columns:
      - name: order_item_id
        description: "Primary key — unique identifier for an order item"
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Foreign key to the order this item belongs to"
        data_tests:
          - not_null
          - relationships:
              to: ref('orders_t')
              field: order_id

      - name: product_id
        description: "Foreign key to the product being purchased"
        data_tests:
          - not_null
          - relationships:
              to: ref('products_t')
              field: product_id

      - name: quantity
        description: "Number of units purchased"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false

      - name: unit_price
        description: "Price per unit at time of purchase"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

      - name: line_amount
        description: "Total amount for this line item (quantity × unit_price)"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

      - name: created_timestamp
        description: "Timestamp the record was created in source"
        

      - name: updated_timestamp
        description: "Timestamp the record was last updated in source"
        data_tests:
          - not_null

      - name: is_active
        description: "Flag indicating whether this order item record is active"
        

  - name: stores_t
    description: "Cleaned/deduplicated stores table from the silver technical layer"
    columns:
      - name: store_id
        description: "Primary key — unique identifier for a store"
        data_tests:
          - not_null
          - unique

      - name: store_name
        description: "Name of the store"
        data_tests:
          - not_null

      - name: city
        description: "City the store is located in"
        

      - name: province
        description: "Province/state the store is located in"
       

      - name: country
        description: "Country the store is located in"
        

      - name: created_timestamp
        description: "Timestamp the record was created in source"
        data_tests:
          - not_null

      - name: updated_timestamp
        description: "Timestamp the record was last updated in source"
        data_tests:
          - not_null

      - name: is_active
        description: "Flag indicating whether the store is currently active"
        